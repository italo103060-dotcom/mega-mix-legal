<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorização - Mega.mix Ofertas</title>
<style>body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#222}</style>
</head>
<body>
<h1>Autorização concluída</h1>
<p>Esta página recebe o retorno do login do TikTok. Você pode fechá-la e voltar ao painel.</p>
<p id="msg"></p>
<script>
  var p = new URLSearchParams(location.search);
  document.getElementById("msg").textContent = p.get("error")
    ? "O TikTok informou um erro: " + p.get("error")
    : "";
</script>
</body>
</html>
